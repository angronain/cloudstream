name: Desktop Installers

# Builds the desktop app installers for macOS, Windows and Linux and publishes them as a GitHub release.
# Runs when a tag like `desktop-v4.8.0` is pushed, or by hand from the Actions tab on such a tag.
on:
  # Only releases build, building every branch push used up runners and risks GitHub disabling Actions on the fork
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            tasks: packageDmg
          - name: macos-x64
            os: macos-15-intel
            tasks: packageDmg
          - name: windows-x64
            os: windows-latest
            tasks: packageMsi packageExe
          - name: linux-x64
            os: ubuntu-latest
            tasks: packageDeb packageRpm

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # jpackage builds the installer with the JDK that runs Gradle, and bundles its runtime
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      # Signs macOS builds with the project's fixed certificate, so macOS keeps the permissions the user
      # granted across updates. Without the secrets (pull requests from forks) builds stay ad-hoc signed.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "No signing certificate, building unsigned"; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | sed -n 's/.*1) \([0-9A-F]\{40\}\).*/\1/p' | head -n 1)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          {
            echo "MAC_SIGNING_IDENTITY=$IDENTITY"
            echo "MAC_SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "MAC_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build installers
        shell: bash
        run: |
          chmod +x gradlew
          tasks=""
          for task in ${{ matrix.tasks }}; do tasks="$tasks :desktopApp:$task"; done
          # Release builds take their version from the tag, which is what the in-app updater compares
          version=""
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then version="-PdesktopVersion=${GITHUB_REF#refs/tags/desktop-v}"; fi
          ./gradlew $tasks $version -PdesktopUpdateRepo=${{ github.repository }} --no-configuration-cache

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: CloudStream-${{ matrix.name }}
          path: |
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

  # The Android app, built at the same time as the desktop installers. It installs as its own app
  # (com.lagradost.cloudstream3.fork), next to the official CloudStream, signed with the fork's own key.
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # app/build.gradle.kts signs with the first keystore in ~/work/_temp/keystore when SIGNING_KEY_ALIAS is set
      - name: Write signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then echo "No signing key, the APK will not be installable"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"
          echo "SIGNING_KEY_ALIAS=key0" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build APK
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePrereleaseRelease -PandroidApplicationIdSuffix=.fork --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: CloudStream-android
          path: app/build/outputs/apk/prerelease/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [package, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers

      # Installers from different architectures share a file name, so they are named by platform. The build name
      # (macos-arm64...) stays in it since installed apps look for it when updating
      - name: Name installers by platform
        run: |
          mkdir release
          version="${GITHUB_REF#refs/tags/desktop-v}"
          for dir in installers/*/; do
            name=$(basename "$dir")
            name="${name#CloudStream-}"
            case "$name" in
              macos-arm64) label="Mac-Apple-Silicon" ;;
              macos-x64) label="Mac-Intel" ;;
              windows-*) label="Windows" ;;
              linux-*) label="Linux" ;;
              android) label="Android" ;;
              *) label="$name" ;;
            esac
            find "$dir" -type f | while read -r file; do
              cp "$file" "release/CloudStream-${version}-${label}-${name}.${file##*.}"
            done
          done
          ls -la release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            **Which file to download**
            - Mac with an M1, M2, M3, M4 or newer chip (Apple Silicon): `Mac-Apple-Silicon` .dmg
            - Mac with an Intel processor: `Mac-Intel` .dmg. Not sure? Apple menu → About This Mac shows "Chip" on Apple Silicon and "Processor" on Intel.
            - Windows: `Windows` .exe (or the .msi)
            - Linux: `Linux` .deb for Debian/Ubuntu, .rpm for Fedora/openSUSE
            - Android: `Android` .apk. It installs as its own app, next to the official CloudStream if you have it.

            Unsigned builds. VLC must be installed for the built-in player, the version for your computer.
            Installed apps update themselves to new releases automatically.
            macOS: if it says the app is damaged, run `xattr -cr /Applications/CloudStream.app`.
            Windows: SmartScreen may warn, choose "More info" → "Run anyway".
